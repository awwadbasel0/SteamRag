name: Verify Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-frontend:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build Frontend Docker image
      run: docker build ./frontend/ --tag steamrag-frontend:$(date +%s)
  
  build-backend:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker image
        run: docker build ./backend/ --tag steamrag-backend:$(date +%s)
  
